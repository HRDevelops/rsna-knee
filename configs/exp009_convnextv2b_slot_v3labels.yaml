# exp009: diversity round (2026-09-10 instruction) — swap the per-series 2.5D encoder from
# DINOv2 ViT-B/14 (exp006) to ConvNeXt-V2-Base (timm convnextv2_base.fcmae_ft_in22k_in1k), a
# fully-convolutional backbone with a different inductive bias than every ensemble member so far
# (all ViT). Everything else held identical to exp006 (labels_v3_candidate, same folds, same
# slice-attention + cross-slot study head, same training recipe) so any OOF delta and any
# correlation-with-exp006 delta are attributable to the backbone swap alone. Goal: OOF >= 0.855
# AND correlation with exp006 < 0.90 — greedy ensemble re-selection only runs if both hold.
#
# model.py note: ConvNeXt has no position embedding and rejects timm's dynamic_img_size kwarg
# (ViT-only) — SlotModel now falls back to plain construction for non-ViT backbones (2026-09-10).
experiment: exp009_convnextv2b_slot_v3labels
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet   # SAME folds as exp002/exp003/exp005/exp006 — not rebuilt
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 384
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: convnextv2_base.fcmae_ft_in22k_in1k
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
