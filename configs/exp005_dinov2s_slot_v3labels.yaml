# exp005: noisy-student round 1 — exp002's exact recipe (DINOv2 ViT-S/14, stability bundle),
# retrained on labels_v3_candidate (image+report blend, docs/label_blend_v3_candidate.md) instead
# of labels_v2_final. Same folds.parquet (built on labels_v2_final, NOT rebuilt) so the OOF
# comparison against exp002 uses identical train/val splits. Pre-registered acceptance test in
# docs/EXPERIMENTS.md (2026-09-08, written before this config was launched): must beat exp002 on
# BOTH OOF AUC vs the ORIGINAL labels_v2_final report labels AND gold-58 macro, not gold-58 alone.
experiment: exp005_dinov2s_slot_v3labels
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet   # SAME folds as exp002 — not rebuilt
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 384
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_small_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
