# exp004: scale ladder step 2 — DINOv3 ViT-S/16 instead of DINOv2 ViT-S/14, everything else
# identical to exp002. Isolates the pretrained-weights variable ONLY (not size — DINOv3-S is
# comparable param count to DINOv2-S, ~22M). Note: DINOv3 uses patch16 not patch14 (confirmed via
# timm.list_models on the cluster: vit_small_patch16_dinov3.lvd1689m is the only pretrained tag) —
# this changes token count per image (384/16=24 vs 384/14, non-integer, interpolated under
# dynamic_img_size=True) but is an unavoidable side effect of comparing the two model families, not
# a deliberate size change.
experiment: exp004_dinov3s_slot_v2labels
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v2_final.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 384
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_small_patch16_dinov3.lvd1689m   # was vit_small_patch14_dinov2.lvd142m in exp002
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
