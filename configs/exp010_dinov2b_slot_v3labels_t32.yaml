# exp010: resolution + slice-count ablation, requested 2026-09-17 as the highest-leverage
# untested axis (small findings — meniscus, cartilage — plausibly resolution-limited; we've been
# at 384px/T=24 since day 1). SPLIT INTO TWO HALVES, see docs/EXPERIMENTS.md's 2026-09-17 entry
# for why: T=32 is a pure load-time change (RSNAKneeDataset._load_slot_volume linspace-subsamples
# from the cache's full native slice count down to T — no cache rebuild needed, free to test) but
# 448px is NOT — scripts/build_cache.py resamples DICOM to a FIXED 0.3mm/px, 384x384 grid at
# cache-BUILD time (data/cache/<study>/<series>.npy is a hardcoded [n_slices,384,384] uint8 array);
# a config image_size of 448 without a cache rebuild only bilinear-upsamples the same 384px data
# (dataset.py's F.interpolate call) — no new real detail, an invalid test of the resolution
# hypothesis. A genuine 448px test needs a new cache at ~0.257mm/px (same ~115mm FOV, finer
# spacing) — measured ~154GB new storage (113GB current cache x (448/384)^2), against only
# 25.71GB free quota as of the last check. THIS CONFIG IS T=32 ONLY, 384px UNCHANGED — the free,
# immediately-launchable half. The 448px half is blocked on a quota decision, not run here.
#
# Otherwise identical to exp006 (same backbone, labels, folds, recipe) so slice count is the ONLY
# variable — clean ablation.
experiment: exp010_dinov2b_slot_v3labels_t32
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet   # SAME folds as exp002/003/005/006 — not rebuilt
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 32   # <-- the ablated variable (exp006: 24)
  image_size: 384         # unchanged (see header — 448 needs a cache rebuild, not done here)
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_base_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8   # unchanged from exp006 — T=32 vs 24 is only a ~1.33x memory increase,
  # expected to still fit in an H100 80GB's headroom without grad accumulation; the
  # grad_accum_steps mechanism (train.py, added for this experiment) is available as a fallback
  # if a run's logs show an OOM, but not preemptively applied here.
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
