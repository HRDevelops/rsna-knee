# exp015: the resolution ablation DONE PROPERLY (2026-09-18, quota now 650GB). Direct comparison to
# exp006 (ViT-B, labels_v3_candidate, same folds, 384px/T=24): the ONLY variable is spatial
# resolution — image_size 384 -> 448 on a genuinely rebuilt cache (data/cache_448, ~0.2571mm/px,
# same ~115mm FOV, slurm/cache_build_448.sbatch), NOT an upsample of the 384px cache (see the exp010
# entry in docs/EXPERIMENTS.md for why a config-only image_size change would be an invalid test).
# The earlier 400-study 384-vs-448 test (exp013/exp014) is VOID — underpowered (80 val studies) and,
# for exp014, ran with a scheduler bug (fixed 2026-09-18) — its numbers must not be cited.
#
# Batch: kept at exp006's batch_size_studies=8 / no accumulation so the comparison is exact. Expected to
# fit: exp010 (T=32, 384px, batch 8) ran on the same H100 80GB and 448px/T=24 carries a similar token
# count per study (6x24x1024 = 147k vs exp010's 6x32x729 = 140k). If a fold OOMs, the fallback is
# batch_size_studies: 4 + grad_accum_steps: 2 (effective batch unchanged; the accumulation scheduler
# bug is fixed) — but note that changes optimizer-step granularity vs exp006, so prefer no-accum.
experiment: exp015_dinov2b_slot_v3labels_448
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache_448
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet   # SAME folds as exp002/003/005/006/010/012
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 448
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_base_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
