# exp014: 448px resolution test for the quota-cheap comparison (ACL workstream item 4, 2026-09-17).
# Uses a FRESHLY BUILT cache at ~0.2571mm/px (slurm/acl_448_cache_build.sbatch) -- same ~115mm
# field of view as the main 0.3mm/px cache, genuinely more pixels per mm, not an upsample of
# already-384px data. Same 400-study subset/split as exp013 (its 384px counterpart) -- resolution
# is the ONLY variable between exp013 and exp014. DELETE data/cache_448_subset/ once this
# comparison is read out; it is a one-off diagnostic cache, not a permanent second variant.
experiment: exp014_dinov2b_slot_v3labels_subset448_test
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache_448_subset
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/acl_448_subset_folds.parquet   # SAME subset/split as exp013
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 448
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_base_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 4    # halved vs exp013 -- 448px is ~1.36x the pixels of 384px per slice;
  grad_accum_steps: 2      # grad_accum keeps the effective batch at 8, matching exp013, per the
  # user's own fallback instruction (real grad_accum_steps support added to train.py 2026-09-17).
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
