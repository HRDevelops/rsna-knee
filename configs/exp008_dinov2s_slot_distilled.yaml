# exp008: efficiency track (CLAUDE.md §8, EXECUTION_PLAN Phase 4). Compact distilled model — same
# DINOv2 ViT-S/14 backbone/architecture as exp002/005, but T=16 slices (down from 24) and 320px
# (down from 384) for faster inference (target <=45min/1300 studies at test time, CLAUDE.md §8).
# Trained with a KL+BCE mix loss: BCE against labels_v3_candidate (the accepted noisy-student
# label generation) + KL-divergence against the ensemble teacher's blended soft predictions
# (artifacts/labels/ensemble_teacher_v1.parquet — exp006+exp003+exp005, per-label prob/rank-mean
# per the 2026-09-09 ensemble-assembly decision). Acceptance target: within 0.015 OOF macro of the
# ensemble's own OOF (0.8744, vs labels_v2_final). Same folds.parquet as every other experiment.
experiment: exp008_dinov2s_slot_distilled
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  distill_labels: ${RSNA_ROOT}/artifacts/labels/ensemble_teacher_v1.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 16
  image_size: 320
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_small_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: kl_bce_mix
  distill_weight: 0.5   # equal BCE/KL mix — not deeply tuned, a defensible neutral default
  label_confidence_weighting: true   # only applies to the BCE half of the mix
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true
