# exp016b_dinov2b_slot_v3labels_auxrep_w050: exp016 multimodal (report-text) auxiliary objective, 2026-09-20 — arm "weight 0.5".
# IDENTICAL to exp006 (ViT-B, labels_v3_candidate, same folds/seed/recipe, 384px, T=24) except for the
# `aux:` block below, so the only variable is the auxiliary report-embedding loss. The model also
# predicts a frozen BGE-M3 embedding of each study's report (all-but-the-top residualized, fit per fold on
# train-split studies only — scripts/build_report_embeddings.py) from its study-level image embedding,
# trained jointly: loss = label BCE + weight * (1 - cosine). Training-only: inference never runs the aux
# head; strip `aux_head.*` from best.pt before staging. Fold-safe by construction (the dataset asserts
# the targets file contains no validation-fold or gold-58 study). Pre-registered bar (see
# docs/EXPERIMENTS.md, 2026-09-20): solo OOF macro gain vs exp006 > +0.0082 (2 SD of the cluster
# bootstrap) to count as real. The deployed ensemble/efficiency notebooks are unaffected either way.
experiment: exp016b_dinov2b_slot_v3labels_auxrep_w050
seed: 42
data:
  cache_dir: ${RSNA_ROOT}/data/cache
  labels: ${RSNA_ROOT}/artifacts/labels/labels_v3_candidate.parquet
  folds: ${RSNA_ROOT}/artifacts/folds.parquet   # SAME folds as exp002/exp003/exp005 — not rebuilt
  gold_reference: ${RSNA_ROOT}/artifacts/gold58.parquet   # unused — gold truth loaded directly from data/raw/train.csv
  slices_per_series: 24
  image_size: 384
  slots: [Sagittal_FS, Sagittal_nonFS, Coronal_FS, Coronal_nonFS, Axial_FS, Axial_nonFS]
  laterality_normalize: true
model:
  backbone: vit_base_patch14_dinov2.lvd142m
  slice_agg: transformer
  study_head: cross_slot_transformer
  num_targets: 12
train:
  epochs: 25
  batch_size_studies: 8
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  precision: bf16
  ema: 0.999
  loss: bce_soft
  label_confidence_weighting: true
aug:
  rotate_deg: 10
  scale: 0.1
  translate: 0.05
  intensity_jitter: 0.1
  coarse_dropout: true
  laterality_swap_prob: 0.3
  fluid_flag_corrupt_prob: 0.05
  vertical_flip: false
eval:
  metric: macro_auc
  report_per_label: true
  save_oof: true

aux:
  type: report_embedding
  weight: 0.5
  targets: ${RSNA_ROOT}/artifacts/report_emb/fold{fold}_target.npz   # {fold} filled in by train.py
